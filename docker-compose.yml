# PostgreSQL only, for local work. The Go binary and the web app run on the
# host, so this file is never a deploy unit — production is the Dockerfile.
services:
  postgres:
    image: postgres:17-alpine
    container_name: jobpulse-postgres
    environment:
      POSTGRES_USER: jobpulse
      POSTGRES_PASSWORD: jobpulse
      POSTGRES_DB: jobpulse
    ports:
      # Override POSTGRES_PORT if 5432 is already taken on your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobpulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse -d jobpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobpulse-pgdata:
