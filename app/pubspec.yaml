name: jobpulse
description: JobPulse — new job alerts from public company job boards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Riverpod is here from the start because ProviderScope has to wrap the app;
  # everything else arrives with the code that needs it.
  # TODO(M3): go_router, dio.
  # TODO(M4): firebase_core, firebase_messaging.
  flutter_riverpod: ^3.0.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
