name: jobpulse
description: JobPulse — new job alerts from public company job boards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # TODO(M4): firebase_core, firebase_messaging.
  flutter_riverpod: ^3.0.3   # state
  go_router: ^17.5.0         # the three routes
  dio: ^5.11.0               # HTTP
  url_launcher: ^6.3.2       # the Apply button
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
