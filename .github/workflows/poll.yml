# The alarm. GitHub emails a failed scheduled run, which turns a silent
# failure into a message — and the failures that matter here are all silent:
# a feed that stops refreshing, and a server that cannot reach your phone, both
# look like a quiet day from the app.
#
# The backend runs always-on, so any hour is a fair hour to be stale. The
# Supabase pg_cron job `jobpulse-wake` pings /healthz every five minutes as a
# second pair of hands; this is the one that complains.
name: poll
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: poll
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: fail if the boards are not being read or push is off
        shell: bash
        run: |
          check() {
            curl -fsS "${{ secrets.JOBPULSE_URL }}/healthz" \
              --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 -o /tmp/health.json
            cat /tmp/health.json; echo
          }
          check
          # A deploy restarts the process, and the first cycle takes a minute
          # or two on a tenth of a CPU. Give it one chance to finish.
          if grep -q '"never ran"' /tmp/health.json; then sleep 150; check; fi
          python3 - <<'PY'
          import json, sys
          h = json.load(open('/tmp/health.json'))
          age, state, push = h.get('poll_age_seconds'), h.get('poller'), h.get('push')
          print(f"poller={state} age={age}s db={h.get('database')} push={push}")
          if h.get('database') != 'ok':
              sys.exit("the database is unreachable")
          if state == 'never ran' or age is None:
              sys.exit("the server is up but has not completed a poll")
          if state == 'failing':
              sys.exit(f"the last poll failed: {h.get('poll_error')}")
          # Half an hour is six missed cycles.
          if age > 1800:
              sys.exit(f"the boards have not been read for {age // 60} minutes")
          if push != 'ok':
              sys.exit(f"push is {push!r}: matches are being found and nobody is told")
          print("fresh, and able to reach the phone")
          PY
