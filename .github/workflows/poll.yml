# A manual poll, kept as the fallback for when the real scheduler is broken.
#
# The schedule that used to live here is gone. GitHub honours a */5 cron as
# best effort, and measured over a day it fired every 25 minutes on average and
# once went 52 — which for an app whose whole promise is seeing a posting
# before other applicants is the difference between the promise and a rounding
# error. An external scheduler (cron-job.org) now calls the same endpoint every
# five minutes, which also keeps the free host awake and therefore cold-start
# free. Run this workflow by hand if that scheduler ever stops.
#
# Secrets: JOBPULSE_URL (the deployment), JOBPULSE_POLL_TOKEN (same value as
# the POLL_TOKEN env on the server).
name: poll
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: wake the backend and run a cycle
        run: |
          # The free host takes up to a minute to spin up, hence the retries.
          curl -fsS -X POST "${{ secrets.JOBPULSE_URL }}/api/poll" \
            -H "Authorization: Bearer ${{ secrets.JOBPULSE_POLL_TOKEN }}" \
            --retry 8 --retry-delay 10 --retry-all-errors --max-time 90
