# The scout: once a week, look for direct job boards belonging to employers
# whose postings already match a saved search but only ever arrive through an
# aggregator. Those jobs are reaching this reader hours late — jobspipe's median
# lag measured twenty-one hours — and a direct board turns that into minutes.
#
# It runs here rather than on the backend for two reasons: this repository is
# public, so GitHub's standard runners are free and have four cores against
# Render's tenth of one; and a weekly agent has no business sharing a process
# with the poller that has to survive.
#
# The model runs on the runner and costs nothing. If GROQ_API_KEY is set as a
# secret it uses Groq's free tier instead, which is a far more capable model —
# either way the scout only proposes. The server verifies every proposal itself.
name: scout
on:
  schedule:
    # Daily, not weekly. The work list has a half-life: eight to eighteen new
    # employers a day turn up whose postings match a saved search but only
    # arrive through an aggregator, and aggregator postings age out after seven
    # days, taking their matches with them. A weekly run would watch most of
    # its own candidates expire before ever looking at them.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      targets:
        description: how many employers to look for
        default: "8"

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Ask what there is to do before spending four minutes downloading a
      # model. Most days there will be something; on the days there is not, this
      # run costs seconds.
      - name: what is worth looking for
        id: work
        env:
          JOBPULSE_API: ${{ secrets.JOBPULSE_URL }}
          POLL_TOKEN: ${{ secrets.JOBPULSE_POLL_TOKEN }}
        run: go run ./cmd/scout -list | tee -a "$GITHUB_OUTPUT"

      # A model on the runner, unless a Groq key makes one unnecessary. The
      # check is in the script rather than an `if:` because the secrets context
      # is not dependable in a step condition.
      - name: bring up a model
        if: steps.work.outputs.targets != '0'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCOUT_LOCAL_MODEL: qwen2.5:7b
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "Groq key present; no local model needed"
            exit 0
          fi
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version >/dev/null && break; sleep 2; done
          ollama pull "$SCOUT_LOCAL_MODEL"

      - name: scout
        if: steps.work.outputs.targets != '0'
        env:
          # The names this repository already uses, set when the poll alarm
          # was wired up — no new secrets to create.
          JOBPULSE_API: ${{ secrets.JOBPULSE_URL }}
          POLL_TOKEN: ${{ secrets.JOBPULSE_POLL_TOKEN }}
          # Groq's free tier if a key is present, the runner's own model if not.
          SCOUT_MODEL_URL: ${{ secrets.GROQ_API_KEY && 'https://api.groq.com/openai/v1/chat/completions' || 'http://localhost:11434/v1/chat/completions' }}
          SCOUT_MODEL: ${{ secrets.GROQ_API_KEY && 'llama-3.3-70b-versatile' || 'qwen2.5:7b' }}
          SCOUT_MODEL_KEY: ${{ secrets.GROQ_API_KEY }}
        run: go run ./cmd/scout -targets ${{ inputs.targets || 8 }} -turns 12
